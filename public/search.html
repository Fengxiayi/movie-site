<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>发现影视 · 光影录</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23f2b33d'/><text x='16' y='23' font-size='19' text-anchor='middle' fill='%2317130a' font-family='sans-serif' font-weight='bold'>影</text></svg>">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main>
  <h1 class="page-title" id="pgTitle">发现影视</h1>
  <p class="page-sub" id="pgSub">按类型、地区、年份与热度筛选片库</p>

  <div class="toolbar" id="toolbar">
    <select id="fCategory"><option value="">全部分类</option></select>
    <select id="fGenre"><option value="">全部类型</option></select>
    <select id="fCountry"><option value="">全部地区</option></select>
    <select id="fDecade"><option value="">全部年代</option></select>
    <select id="fSort">
      <option value="hot">综合热度</option>
      <option value="rating">站内评分</option>
      <option value="year_desc">年份（新→旧）</option>
      <option value="year_asc">年份（旧→新）</option>
      <option value="fav">收藏最多</option>
      <option value="title">按名称</option>
      <option value="random">随机看看</option>
    </select>
    <select id="fRes">
      <option value="">不限资源</option>
      <option value="1">仅有网盘资源</option>
    </select>
    <button class="btn sm ghost" id="resetBtn">重置条件</button>
  </div>

  <div id="resultBox"></div>
</main>
<script src="/js/app.js"></script>
<script src="/js/search.js"></script>
</body>
</html>
