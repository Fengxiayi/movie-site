<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 / 注册 · 光影录</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23f2b33d'/><text x='16' y='23' font-size='19' text-anchor='middle' fill='%2317130a' font-family='sans-serif' font-weight='bold'>影</text></svg>">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>欢迎来到 光影录</h1>
      <p class="lead">注册后即可收藏影片、参与讨论、获取资源。</p>

      <div class="switch-tabs">
        <button id="tabLogin" class="on">登录</button>
        <button id="tabReg">注册</button>
      </div>

      <!-- 登录 -->
      <div id="formLogin">
        <label class="field"><span>用户名</span>
          <input type="text" id="lUser" maxlength="20" placeholder="请输入用户名" autocomplete="username">
        </label>
        <label class="field"><span>密码</span>
          <input type="password" id="lPass" maxlength="64" placeholder="请输入密码" autocomplete="current-password">
        </label>
        <div class="err" id="lErr"></div>
        <button class="btn primary block" id="btnLogin" style="height:42px;margin-top:6px">登录</button>
        <p class="hint" style="text-align:center;margin-top:14px">
          仅需用户名与密码即可注册，无需手机号或邮箱。
        </p>
      </div>

      <!-- 注册 -->
      <div id="formReg" style="display:none">
        <label class="field"><span>用户名</span>
          <input type="text" id="rUser" maxlength="20" placeholder="2-20 位，支持中文/字母/数字" autocomplete="username">
        </label>
        <label class="field"><span>昵称（可选）</span>
          <input type="text" id="rNick" maxlength="24" placeholder="展示给他人的名字，留空同用户名">
        </label>
        <label class="field"><span>密码</span>
          <input type="password" id="rPass" maxlength="64" placeholder="至少 6 位" autocomplete="new-password">
        </label>
        <label class="field"><span>确认密码</span>
          <input type="password" id="rPass2" maxlength="64" placeholder="再输入一次" autocomplete="new-password">
        </label>
        <div class="err" id="rErr"></div>
        <button class="btn primary block" id="btnReg" style="height:42px;margin-top:6px">注册并登录</button>
      </div>
    </div>
  </div>
</main>
<script src="/js/app.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
