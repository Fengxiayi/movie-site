# =========================================================
#  Nginx 反向代理配置（初始引导版 / HTTP）
#  安装位置：/etc/nginx/conf.d/movie-site.conf
#  用途：在尚未签发 SSL 证书时先让站点可用，并完成 Certbot 验证
#  签发证书后请改用 nginx.conf（含 HTTPS 版本）
# =========================================================

upstream movie_site {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    # 换成你的域名；没有域名就保留 _
    server_name _;

    # Certbot HTTP-01 验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 2m;
    access_log /var/log/nginx/movie-site.access.log;
    error_log  /var/log/nginx/movie-site.error.log;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://movie_site;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_buffering       on;

        # WebSocket 预留（本站暂不需要，保留以防后续扩展）
        proxy_set_header Upgrade    $http_upgrade;
    }

    # 静态资源由 Nginx 直接返回，带长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2|mp4)$ {
        root /opt/movie-site/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri @proxy;
    }

    location @proxy {
        proxy_pass http://movie_site;
        proxy_set_header Host $host;
    }

    # 禁止访问敏感路径
    location ~ /\. { deny all; }
}
