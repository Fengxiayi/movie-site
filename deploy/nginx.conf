# =========================================================
#  Nginx 反向代理配置（正式版 / HTTPS）
#  安装位置：/etc/nginx/conf.d/movie-site.conf
#  前置：已通过 Certbot 为你的域名签发证书，并把下面的
#        your.domain.com 全部替换成真实域名
# =========================================================

upstream movie_site {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---------- HTTP：全部跳转 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name your.domain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS 主站 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your.domain.com;

    ssl_certificate     /etc/letsencrypt/live/your.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.domain.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/your.domain.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 2m;
    access_log /var/log/nginx/movie-site.access.log;
    error_log  /var/log/nginx/movie-site.error.log;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml image/webp;
    gzip_min_length 1024;

    location / {
        proxy_pass http://movie_site;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # 静态资源直出
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2|mp4)$ {
        root /opt/movie-site/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri @proxy;
    }

    location @proxy {
        proxy_pass http://movie_site;
        proxy_set_header Host $host;
    }

    location ~ /\. { deny all; }
}
